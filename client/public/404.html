<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Converts path to query string and redirects to index.html
      const base = '/research_portfolio';
      const path = window.location.pathname;
      // Remove base from path
      let route = path.startsWith(base) ? path.slice(base.length) : path;
      if (!route || route === '/') route = '/';
      
      // Redirect with the route as a query parameter
      window.location.replace(base + '/?p=' + encodeURIComponent(route));
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
